<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <p class="eyebrow">Today</p>
        <h1>Todo list</h1>
        <p class="subtitle">Add a task, check it off, and keep going.</p>
      </header>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <label class="sr-only" for="todo-input">New task</label>
        <input
          id="todo-input"
          type="text"
          name="task"
          placeholder="What needs doing?"
          maxlength="200"
          required
        />
        <button type="submit">Add</button>
      </form>

      <section class="panel" aria-labelledby="list-heading">
        <div class="toolbar">
          <h2 id="list-heading" class="count" aria-live="polite">0 tasks left</h2>
          <div class="filters" role="tablist" aria-label="Filter tasks">
            <button type="button" class="filter is-active" data-filter="all">All</button>
            <button type="button" class="filter" data-filter="active">Active</button>
            <button type="button" class="filter" data-filter="completed">Done</button>
          </div>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <p id="empty-state" class="empty">Nothing here yet. Add your first task above.</p>

        <div class="footer-bar">
          <button type="button" id="clear-completed" class="text-btn" hidden>
            Clear completed
          </button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
